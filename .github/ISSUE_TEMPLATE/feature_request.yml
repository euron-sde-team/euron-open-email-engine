name: Feature request
description: Propose a capability or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today, and for whom (tenant marketers and admins, operators)? Say which area it touches: domains, audience, templates, campaigns, tracking, deliverability or the operator plane.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. API shapes, config, or UI sketches welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
