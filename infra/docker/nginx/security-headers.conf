# Included in every location that sets its own headers (nginx drops server-level
# add_header directives in a location that has any). The same set CloudFront's managed
# security-headers policy applies on AWS.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
