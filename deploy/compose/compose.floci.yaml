# ─────────────────────────────────────────────────────────────────────────────
# Overlay: emulated AWS with Floci (https://github.com/floci-io/floci, MIT).
#
# The SAME Terraform modules that provision real AWS (infra/terraform/modules) run here
# against the emulator: the `terraform` one-shot applies infra/terraform/envs/local-floci
# (KMS key, Secrets Manager secret, the file bucket, a Route53 zone, the SES
# identity with DKIM, and the SES events SNS topic + SQS queue) before the API starts.
# Every AWS client in the API then talks to the emulator (AWS_ENDPOINT_URL):
#
#   mail     SES v2 from no-reply@mail.example.test (verified through DKIM); the
#            emulator relays every message to Mailpit (http://localhost:8126)
#   events   per-tenant configuration sets publish to the SNS topic, the API
#            long-polls the SQS queue behind it
#   files    CSV imports and images: local disk by default. The emulator's bucket (open-email-local-files)
#            is provisioned too: set AWS_S3_BUCKET=open-email-local-files in .env to
#            use it. Presigned download links then name http://floci:4566, which
#            only resolves inside this compose network, so browser downloads need
#            "127.0.0.1 floci" in your hosts file and EMAIL_FLOCI_PORT=4566.
#
# Redis stays a plain container. Floci emulates the ElastiCache control plane, but
# only backs a replication group with a real server when it can reach the Docker
# socket; mounting that into an emulator is not worth it for a local cache.
# ─────────────────────────────────────────────────────────────────────────────
x-floci-env: &floci-env
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://floci:4566
  # The SES and SQS clients use these static keys; the emulator accepts any.
  AWS_SES_REGION: us-east-1
  AWS_SES_ACCESS_KEY: test
  AWS_SES_SECRET_KEY: test
  EMAIL_SES_MODE: aws
  AWS_SES_FROM_EMAIL: no-reply@mail.example.test
  AWS_SES_FROM_NAME: ${EMAIL_BRAND_NAME:-Open Email Engine}
  # Names come from infra/terraform/envs/local-floci (name_prefix open-email-local).
  SES_EVENTS_SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:open-email-local-ses-events
  SES_EVENTS_QUEUE_URL: http://floci:4566/000000000000/open-email-local-ses-events

x-after-terraform: &after-terraform
  terraform:
    condition: service_completed_successfully

services:
  floci:
    image: floci/floci:2.3.0
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /data
      # Relay every SES send to Mailpit so mail can be read in a browser.
      FLOCI_SERVICES_SES_SMTP_HOST: mailpit
      FLOCI_SERVICES_SES_SMTP_PORT: "1025"
    ports:
      - "127.0.0.1:${EMAIL_FLOCI_PORT:-4677}:4566"
    networks:
      default:
        # S3 Control (bucket tags) addresses <account id>.<endpoint host>.
        aliases: ["000000000000.floci"]
    volumes:
      - flocidata:/data
    # No healthcheck: the image ships no HTTP client; the terraform one-shot polls it.

  # Every mail the emulator's SES sends. Web UI: http://localhost:8126
  mailpit:
    image: axllent/mailpit:v1.27.9
    ports:
      - "127.0.0.1:${EMAIL_MAILPIT_PORT:-8126}:8025"

  # One-shot: provision the emulator with the production modules.
  terraform:
    image: hashicorp/terraform:1.16.6
    working_dir: /infra/envs/local-floci
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "waiting for floci..."
        until wget -q -O /dev/null http://floci:4566/; do sleep 1; done
        mkdir -p /tfdata/state
        terraform init -input=false -no-color >/dev/null
        # State lives in the tfdata volume, so it shares the emulator's lifecycle
        # (make down wipes both together).
        terraform apply -input=false -auto-approve -no-color -state=/tfdata/state/local.tfstate \
          -var endpoint=http://floci:4566
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "1"
      TF_DATA_DIR: /tfdata
    volumes:
      - ../../infra/terraform:/infra
      - tfdata:/tfdata
    depends_on:
      - floci
      - mailpit
    restart: "no"

  migrate:
    depends_on: *after-terraform

  api:
    environment:
      <<: *floci-env
    depends_on: *after-terraform

volumes:
  flocidata:
  tfdata:
