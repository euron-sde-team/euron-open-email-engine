# ─────────────────────────────────────────────────────────────────────────────
# Euron Open Email Engine: local stack (cloud-agnostic base).
#
# Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# On its own the base runs without any AWS at all: files on local disk, email
# simulated (EMAIL_SES_MODE=simulated: the mailer emits SES-shaped events itself), the SES
# consumers idle.
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways. `make up-aws`
# also reads deploy/compose/.env.aws, whose values win over the defaults here.
#
# Host ports (override in .env, or in your shell, if they clash with something else):
#   app 3650   console 3660   api 5126   postgres 5572   redis 6509
#   floci 4677   mailpit 8126 (with the Floci overlay)
#
# The two single-page apps are static builds (nginx) that call the API directly at
# http://localhost:5126 (VITE_API_BASE_URL is baked in at build time; CORS_ORIGINS
# admits both). No AWS account is needed anywhere: sending runs in the simulated SES
# mode, or against the Floci emulator with the overlay.
# ─────────────────────────────────────────────────────────────────────────────
name: mail

# Every value an overlay or an env file may want to change is a ${NAME:-default}
# interpolation, so `--env-file .env.aws` (make up-aws) and your shell can set it; the
# overlays then set their own values on top. Precedence, highest first: an overlay's
# `environment:`, your shell, the last --env-file (.env.aws for up-aws, then .env), the
# default below.
x-api-env: &api-env
  # Development mode: the production guards (generated secrets, CORS) only warn, and
  # the stack links to localhost, which production would refuse.
  NODE_ENV: development
  TZ: UTC
  PORT: "5126"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  BRAND_NAME: ${EMAIL_BRAND_NAME:-Open Email Engine}
  # Where the browser lands (links in emails and password resets).
  EMAIL_APP_URL: http://localhost:${EMAIL_WEB_PORT:-3650}
  OPERATOR_APP_URL: http://localhost:${EMAIL_CONSOLE_PORT:-3660}
  # The API's own public base (unsubscribe, tracking, form and web-view links, signed local files).
  APP_PUBLIC_URL: http://localhost:${EMAIL_API_PORT:-5126}
  CORS_ORIGINS: http://localhost:${EMAIL_WEB_PORT:-3650},http://localhost:${EMAIL_CONSOLE_PORT:-3660}
  # The browser talks to the API directly: no proxy hop to trust.
  TRUST_PROXY: "0"
  PG_DATABASE_HOST: postgres
  PG_DATABASE_PORT: "5432"
  PG_DATABASE_USER: mail
  PG_DATABASE_PASSWORD: mail
  PG_DATABASE: mail
  PG_POOL_MAX: ${PG_POOL_MAX:-10}
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${EMAIL_JWT_SECRET:?run `make env` first}
  # Encrypts the secrets the API stores at rest. Changing it makes the stored ones
  # unreadable (re-enter them).
  AWS_REGION: ${AWS_REGION:-us-east-1}
  # Files (CSV imports, uploaded images) on local disk unless an overlay (or you) sets a
  # bucket.
  AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
  LOCAL_STORAGE_DIR: /app/.local-storage
  # Email engine. simulated: no AWS, the mailer emits SES-shaped events through the same
  # handler (bounce@, soft@ and complaint@ addresses misbehave on purpose). aws: real SES
  # (or Floci with the overlay).
  EMAIL_SES_MODE: ${EMAIL_SES_MODE:-simulated}
  # Host the tracking CNAMEs (track.<tenant domain>) point to. Locally the API itself;
  # on AWS the load balancer or CloudFront host.
  EMAIL_TRACKING_HOST: ${EMAIL_TRACKING_HOST:-localhost}
  # Tracking and unsubscribe links are signed with these (32+ characters each).
  EMAIL_UNSUBSCRIBE_SIGNING_SECRET: ${EMAIL_UNSUBSCRIBE_SIGNING_SECRET:?run `make env` first}
  EMAIL_TRACKING_SIGNING_SECRET: ${EMAIL_TRACKING_SIGNING_SECRET:?run `make env` first}
  # Sends per second per tenant, and for the whole SES account (SES max send rate).
  EMAIL_DEFAULT_TENANT_TPS: ${EMAIL_DEFAULT_TENANT_TPS:-5}
  EMAIL_ACCOUNT_TPS: ${EMAIL_ACCOUNT_TPS:-14}
  # Reputation gates. A rate at or above WARN throttles a tenant, at or above PAUSE
  # freezes its marketing mail. SES itself reviews at 5 percent bounce and 0.1 percent
  # complaints.
  EMAIL_REPUTATION_BOUNCE_WARN: ${EMAIL_REPUTATION_BOUNCE_WARN:-0.03}
  EMAIL_REPUTATION_BOUNCE_PAUSE: ${EMAIL_REPUTATION_BOUNCE_PAUSE:-0.05}
  EMAIL_REPUTATION_COMPLAINT_WARN: ${EMAIL_REPUTATION_COMPLAINT_WARN:-0.0005}
  EMAIL_REPUTATION_COMPLAINT_PAUSE: ${EMAIL_REPUTATION_COMPLAINT_PAUSE:-0.001}
  # Simulated mode: a domain verifies on its own after this many minutes without DNS
  # ("Check now" verifies at once).
  EMAIL_DOMAIN_SIMULATE_VERIFY_MINUTES: ${EMAIL_DOMAIN_SIMULATE_VERIFY_MINUTES:-2}

# migrate and api are one image with two commands. Each carries the same build so
# either can be started alone; BuildKit builds it once and reuses the cache.
x-api-build: &api-build
  context: ../..
  dockerfile: infra/docker/api.Dockerfile

services:
  postgres:
    image: postgres:16.12-alpine
    environment:
      POSTGRES_DB: mail
      POSTGRES_USER: mail
      POSTGRES_PASSWORD: mail
    ports:
      - "127.0.0.1:${EMAIL_PG_PORT:-5572}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail -d mail"]
      interval: 3s
      timeout: 3s
      retries: 30

  # The BullMQ scheduler behind the recurring jobs, rate limits, the email send limiter
  # and resolver caches. ElastiCache (infra/terraform/modules/cache) on AWS.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${EMAIL_REDIS_PORT:-6509}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot: apply db/migrations, then exit 0. The API waits for it.
  migrate:
    build: *api-build
    image: open-email-api:local
    command: ["node", "db/migrate.js"]
    environment:
      <<: *api-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # HTTP on 5126 plus the background jobs (one cluster worker owns them).
  api:
    build: *api-build
    image: open-email-api:local
    command: ["node", "--enable-source-maps", "dist/index.js"]
    # Anything else in .env (provider keys, extra settings the API reads) reaches the
    # API as is; the explicit environment below wins on conflicts.
    env_file: [.env]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${EMAIL_API_PORT:-5126}:5126"
    volumes:
      - files:/app/.local-storage
    tmpfs:
      - /tmp:uid=1000,gid=1000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The tenant app (apps/web), static on nginx.
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${EMAIL_API_PORT:-5126}/api/v1
    image: open-email-web:local
    ports:
      - "127.0.0.1:${EMAIL_WEB_PORT:-3650}:8080"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # The operator console (apps/console), static on nginx. Its API base is the operator
  # plane, /api/v1/operator.
  console:
    build:
      context: ../..
      dockerfile: infra/docker/console.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${EMAIL_API_PORT:-5126}/api/v1/operator
    image: open-email-console:local
    ports:
      - "127.0.0.1:${EMAIL_CONSOLE_PORT:-3660}:8080"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  files:
